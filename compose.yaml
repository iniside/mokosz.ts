services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: mokosz
      POSTGRES_PASSWORD: mokosz
      POSTGRES_DB: mokosz
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # TCP check: the init-time temporary server listens on the socket only.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "mokosz", "-d", "mokosz"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
